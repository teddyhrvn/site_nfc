<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue de Jeux</title>
  <style>
    /* --- RESET & VARIABLES GLOBALES --- */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0f1219;
      --card-bg: #1a1f2c;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e3545;
      --radius: 12px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    /* --- LAYOUT PRINCIPAL --- */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap; /* S'adapte si l'écran est très étroit */
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-bar {
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--accent-color);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* --- SECTION HERO / TITRE --- */
    .hero {
      margin-bottom: 2rem;
      text-align: left;
    }

    .hero h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem 0;
      word-wrap: break-word;
    }

    .hero p {
      color: var(--text-muted);
      margin: 0;
      font-size: 1rem;
    }

    /* --- FILTRES & BARRE D'ACTION --- */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      overflow-x: auto; /* Permet de scroller les filtres horizontalement sur mobile */
      padding-bottom: 0.5rem;
      -webkit-overflow-scrolling: touch;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    /* --- GRILLE DE JEUX --- */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .game-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background-color: #2a2f3d;
    }

    .game-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: #fff;
    }

    .game-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }

    .btn-details {
      margin-top: auto;
      width: 100%;
      padding: 0.6rem;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-details:hover {
      background-color: var(--accent-hover);
    }

    /* --- OPTIMISATIONS SPÉCIFIQUES MOBILE (< 768px) --- */
    @media (max-width: 768px) {
      header {
        padding: 0.85rem 1rem;
      }

      .nav-container {
        flex-direction: column;
        align-items: stretch;
      }

      .search-bar {
        max-width: 100%;
      }

      .hero h1 {
        font-size: 1.5rem;
      }

      .hero p {
        font-size: 0.9rem;
      }

      /* Passage de la grille en 2 colonnes ou 1 colonne fluide */
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.85rem;
      }

      .game-info {
        padding: 0.75rem;
      }

      .game-title {
        font-size: 0.95rem;
      }

      .game-meta {
        font-size: 0.75rem;
        flex-direction: column;
        gap: 0.2rem;
      }

      .btn-details {
        padding: 0.5rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">🎮 Ma Collection</a>
      <div class="search-bar">
        <input type="text" placeholder="Rechercher un jeu...">
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Ma Bibliothèque de Jeux</h1>
      <p>Gère, évalue et suis la progression de tes jeux vidéo.</p>
    </section>

    <!-- Filtres scrollables au doigt sur mobile -->
    <div class="controls">
      <button class="filter-btn active">Tous</button>
      <button class="filter-btn">En cours</button>
      <button class="filter-btn">Terminés</button>
      <button class="filter-btn">Liste d'envies</button>
    </div>

    <!-- Grille Responsive -->
    <div class="games-grid">
      
      <div class="game-card">
        <img src="https://via.placeholder.com/400x225" alt="Cyberpunk 2077" class="game-cover">
        <div class="game-info">
          <h2 class="game-title">Cyberpunk 2077</h2>
          <div class="game-meta">
            <span>RPG</span>
            <span>★ 4.5/5</span>
          </div>
          <a href="#" class="btn-details">Voir la fiche</a>
        </div>
      </div>

      <div class="game-card">
        <img src="https://via.placeholder.com/400x225" alt="Elden Ring" class="game-cover">
        <div class="game-info">
          <h2 class="game-title">Elden Ring</h2>
          <div class="game-meta">
            <span>Action RPG</span>
            <span>★ 4.9/5</span>
          </div>
          <a href="#" class="btn-details">Voir la fiche</a>
        </div>
      </div>

      <div class="game-card">
        <img src="https://via.placeholder.com/400x225" alt="Genshin Impact" class="game-cover">
        <div class="game-info">
          <h2 class="game-title">Genshin Impact</h2>
          <div class="game-meta">
            <span>Aventure</span>
            <span>★ 4.2/5</span>
          </div>
          <a href="#" class="btn-details">Voir la fiche</a>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
